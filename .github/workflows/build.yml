
name: ASTROSPHERE Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout project
        uses: actions/checkout@v5

      # 2. Install Java
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Locate Android SDK
      - name: Locate Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV

          echo "Android SDK:"
          ls -la "$SDK_ROOT"

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null \
            | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      # 4. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      # 5. Build Android APK
      - name: Build APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --info 2>&1 | tee build.log

      # 6. Search for generated APK
      - name: Locate Generated APK
        run: |
          echo "Searching for APK files..."

          find . -type f -name "*.apk" -print

          APK=$(find . -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK generated"
            exit 1
          fi

          echo "Found APK: $APK"

          echo "APK_PATH=$APK" >> $GITHUB_ENV

      # 7. Upload APK
      - name: Upload ASTROSPHERE APK
        uses: actions/upload-artifact@v4
        with:
          name: ASTROSPHERE-2.0-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      # 8. Upload diagnostic log
      - name: Upload Build Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ASTROSPHERE-BUILD-LOG
          path: build.log
          if-no-files-found: warn
