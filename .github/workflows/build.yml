
name: ASTROSPHERE Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null \
            | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      - name: Build AstroSphere APK
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$NASA_API_KEY" ]; then
            echo "ERROR: NASA_API_KEY secret is missing"
            exit 1
          fi

          echo "Building AstroSphere 2.1..."

          gradle assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found"
            find . -name "*.apk" -print
            exit 1
          fi

          echo "APK_PATH=$APK" >> $GITHUB_ENV

          echo "APK successfully generated."
          ls -lh "$APK"

      - name: Upload AstroSphere 2.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: ASTROSPHERE-2.1-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Upload Build Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ASTROSPHERE-BUILD-LOG
          path: build.log
          if-no-files-found: warn
