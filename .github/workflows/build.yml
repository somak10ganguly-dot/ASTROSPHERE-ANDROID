
name: ASTROSPHERE Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)

          echo "$(dirname "$SDKMANAGER")" >> $GITHUB_PATH

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: |
          gradle assembleDebug --stacktrace --info 2>&1 | tee build.log

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload ASTROSPHERE APK
        uses: actions/upload-artifact@v4
        with:
          name: ASTROSPHERE-2.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ASTROSPHERE-BUILD-LOG
          path: build.log
          if-no-files-found: warn



